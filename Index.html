<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Калькулятор</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
    font-family:'Segoe UI',Arial,sans-serif;
    padding:20px;
  }
  .calc {
    width:100%;
    max-width:360px;
    background:#0f172a;
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    border:1px solid #1e293b;
  }
  .display {
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    text-align:right;
    min-height:100px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }
  .history {
    color:#64748b;
    font-size:16px;
    min-height:22px;
    margin-bottom:8px;
    word-wrap:break-word;
  }
  .result {
    color:#fff;
    font-size:42px;
    font-weight:bold;
    word-wrap:break-word;
    line-height:1.1;
  }
  .buttons {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  button {
    padding:20px 0;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#1e293b;
    color:#fff;
    transition:0.15s;
  }
  button:active { transform:scale(0.95); }
  .num { background:#334155; }
  .op { background:#f59e0b; color:#1a1a2e; }
  .equal { background:#10b981; color:#fff; grid-column:span 2; }
  .clear { background:#ef4444; color:#fff; }
  .del { background:#64748b; color:#fff; }
</style>
</head>
<body>

<div class="calc">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button class="del" onclick="del()">⌫</button>
    <button class="op" onclick="op('%')">%</button>
    <button class="op" onclick="op('/')">÷</button>

    <button class="num" onclick="num('7')">7</button>
    <button class="num" onclick="num('8')">8</button>
    <button class="num" onclick="num('9')">9</button>
    <button class="op" onclick="op('*')">×</button>

    <button class="num" onclick="num('4')">4</button>
    <button class="num" onclick="num('5')">5</button>
    <button class="num" onclick="num('6')">6</button>
    <button class="op" onclick="op('-')">−</button>

    <button class="num" onclick="num('1')">1</button>
    <button class="num" onclick="num('2')">2</button>
    <button class="num" onclick="num('3')">3</button>
    <button class="op" onclick="op('+')">+</button>

    <button class="num" onclick="num('0')">0</button>
    <button class="num" onclick="num('.')">.</button>
    <button class="equal" onclick="calc()">=</button>
  </div>
</div>

<script>
  var current = "0";
  var previous = "";
  var operator = null;
  var justCalculated = false;

  var resultEl = document.getElementById("result");
  var historyEl = document.getElementById("history");

  function update() {
    resultEl.textContent = current;
    if (operator && previous) {
      historyEl.textContent = previous + " " + operator;
    } else {
      historyEl.textContent = "";
    }
  }

  function num(n) {
    if (justCalculated) {
      current = "0";
      justCalculated = false;
    }
    if (n === "." && current.indexOf(".") !== -1) return;
    if (current === "0" && n !== ".") {
      current = n;
    } else {
      current += n;
    }
    update();
  }

  function op(o) {
    if (current === "" || current === "-") return;
    if (operator && previous && !justCalculated) {
      calc();
    }
    previous = current;
    operator = o;
    current = "0";
    justCalculated = false;
    update();
  }

  function calc() {
    if (!operator || previous === "") return;

    var a = parseFloat(previous);
    var b = parseFloat(current);
    var res = 0;

    if (operator === "+") res = a + b;
    else if (operator === "-") res = a - b;
    else if (operator === "*") res = a * b;
    else if (operator === "/") {
      if (b === 0) {
        resultEl.textContent = "Ошибка";
        historyEl.textContent = "Деление на ноль";
        current = "0";
        previous = "";
        operator = null;
        justCalculated = true;
        return;
      }
      res = a / b;
    }
    else if (operator === "%") res = a % b;

    historyEl.textContent = previous + " " + operator + " " + current + " =";
    current = String(Math.round(res * 100000000) / 100000000);
    previous = "";
    operator = null;
    justCalculated = true;

    resultEl.textContent = current;
  }

  function clearAll() {
    current = "0";
    previous = "";
    operator = null;
    justCalculated = false;
    update();
  }

  function del() {
    if (justCalculated) {
      clearAll();
      return;
    }
    if (current.length > 1) {
      current = current.slice(0, -1);
    } else {
      current = "0";
    }
    update();
  }

  update();
</script>
</body>
  </html>
